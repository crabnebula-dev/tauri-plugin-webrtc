"$schema" = "schemas/schema.json"

[default]
description = "Peer connections and data channels. Grants no capture (microphone, camera, screen)."
permissions = ["allow-peer", "allow-data"]

[[set]]
identifier = "allow-peer"
description = "Create and negotiate peer connections."
permissions = [
  "allow-pc-create",
  "allow-pc-create-offer",
  "allow-pc-create-answer",
  "allow-pc-set-local",
  "allow-pc-set-remote",
  "allow-pc-add-ice",
  "allow-pc-get-stats",
  "allow-pc-close",
]

[[set]]
identifier = "allow-data"
description = "Create and use data channels."
permissions = [
  "allow-dc-create",
  "allow-dc-send",
  "allow-dc-close",
  "allow-dc-buffered-amount",
  "allow-dc-set-threshold",
]
