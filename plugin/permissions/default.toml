"$schema" = "schemas/schema.json"

[default]
description = "Peer connections, data channels and media transport. Capture stays governed by the webview's own getUserMedia permissions."
permissions = ["allow-peer", "allow-data", "allow-media"]

[[set]]
identifier = "allow-peer"
description = "Create and negotiate peer connections."
permissions = [
  "allow-pc-create",
  "allow-pc-create-offer",
  "allow-pc-create-answer",
  "allow-pc-set-local",
  "allow-pc-set-remote",
  "allow-pc-add-ice",
  "allow-pc-get-stats",
  "allow-pc-close",
  "allow-pc-restart-ice",
]

[[set]]
identifier = "allow-data"
description = "Create and use data channels."
permissions = [
  "allow-dc-create",
  "allow-dc-send",
  "allow-dc-close",
  "allow-dc-buffered-amount",
  "allow-dc-set-threshold",
]

[[set]]
identifier = "allow-media"
description = "Send and receive encoded media on transceivers."
permissions = [
  "allow-pc-upsert-transceiver",
  "allow-pc-request-keyframe",
  "allow-media-push",
]
