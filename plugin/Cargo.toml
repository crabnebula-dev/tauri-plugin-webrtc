[package]
name = "tauri-plugin-webrtc"
description = "WebRTC for Tauri on Linux via a standards-shaped JS shim over a pure Rust engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
links = "tauri-plugin-webrtc"

[dependencies]
tauri = { version = "2" }
tauri-webrtc-engine = { path = "../crates/engine", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[features]
default = ["turn-tls-ring", "pq-moduletto"]
# TURN over TLS (turns:) with ring (compiles C and assembly).
turn-tls-ring = ["tauri-webrtc-engine/turn-tls-ring"]
# TURN over TLS with the pure-Rust RustCrypto provider (pre-release).
turn-tls-rustcrypto = ["tauri-webrtc-engine/turn-tls-rustcrypto"]
# Post-quantum key agreement (X25519MLKEM768) for DTLS 1.3 and TURN over TLS,
# with moduletto (default) or RustCrypto ml-kem. See the engine manifest.
pq-hybrid = ["tauri-webrtc-engine/pq-hybrid"]
pq-moduletto = ["tauri-webrtc-engine/pq-moduletto"]
