name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, to catch new RustSec advisories and changes on qrtc main.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit. The tag each SHA was taken from is noted.
jobs:
  supply-chain:
    # deny.toml lists the accepted advisories with the reason for each.
    name: cargo-deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
