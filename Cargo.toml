[workspace]
resolver = "3"
members = ["crates/engine", "plugin", "examples/e2e-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crabnebula-dev/tauri-plugin-webrtc"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
